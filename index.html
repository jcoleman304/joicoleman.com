<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joi Coleman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0A0A0A;
            color: #FAFAF8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 400;
            margin-bottom: 0.6rem;
        }

        .tagline {
            font-size: 0.8rem;
            font-weight: 300;
            color: #777;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 280px;
            margin: 0 auto;
        }

        .links a {
            display: block;
            padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            color: #FAFAF8;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }

        .links a:hover { border-color: #B89B5E; }
    </style>
</head>
<body>
    <div class="page">
        <h1>Joi Coleman</h1>
        <p class="tagline">Music Executive. Studio Owner. Builder.</p>
        <div class="links">
            <a href="https://torchatl.com">Torch ATL</a>
            <a href="https://torchmusicgroup.com">Torch Music Group</a>
            <a href="/consulting">Consulting</a>
        </div>
    </div>
</body>
</html>
