<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joi Coleman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #0A0A0A;
            --off-white: #FAFAF8;
            --gold: #B89B5E;
            --gray-text: #777;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--black);
            color: var(--off-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(184, 155, 94, 0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 2rem;
            max-width: 520px;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-bottom: 0.75rem;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--gray-text);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }

        .links a {
            display: block;
            padding: 0.9rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--off-white);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: border-color 0.25s, background 0.25s, color 0.25s;
        }

        .links a:hover {
            border-color: var(--gold);
            background: rgba(184, 155, 94, 0.08);
        }

        .links a.primary {
            border-color: var(--gold);
            color: var(--gold);
        }

        .links a.primary:hover {
            background: var(--gold);
            color: var(--black);
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .socials a {
            color: var(--gray-text);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .socials a:hover {
            color: var(--off-white);
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--gold);
            margin: 0 auto 3rem;
        }

        /* fade in */
        .container > * {
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s ease forwards;
        }
        .container > *:nth-child(1) { animation-delay: 0.1s; }
        .container > *:nth-child(2) { animation-delay: 0.2s; }
        .container > *:nth-child(3) { animation-delay: 0.35s; }
        .container > *:nth-child(4) { animation-delay: 0.5s; }
        .container > *:nth-child(5) { animation-delay: 0.65s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="name">Joi Coleman</h1>
        <p class="tagline">Music Executive. Studio Owner. Builder.</p>
        <div class="divider"></div>
        <div class="links">
            <a href="https://torchatl.com">Torch ATL</a>
            <a href="https://torchmusicgroup.com">Torch Music Group</a>
            <a href="/consulting">AI Operations Consulting</a>
        </div>
        <div class="socials">
            <a href="https://instagram.com/joicoleman">Instagram</a>
            <a href="https://linkedin.com/in/joicoleman">LinkedIn</a>
            <a href="mailto:joi.coleman@torchmusicgroup.com">Email</a>
        </div>
    </div>

</body>
</html>
